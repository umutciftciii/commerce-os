# TODO-176 — E2E storefront override (CI ONLY).
#
# KRITIK bake gotcha: `storefront-web` (docker-compose.yml) kaynagi volume MOUNT ETMEZ; build
# context = main repo. Bu yuzden LOCAL dogrulama + sonraki testid task'lari HOST `next dev` :3100
# ile yapilir (`pnpm e2e:storefront` — worktree kodunu servis eder). Bu servis YALNIZ CI icindir:
# CI branch checkout'undan build eder, e2e-store slug'ini servis eder ve :3100'e baglanir.
#
# Kullanim (CI):
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.e2e.yml up -d storefront-web-e2e
services:
  storefront-web-e2e:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
    # storefront `dev` scripti `--port 3000` SABIT; app scriptine dokunmadan --port override.
    command: pnpm --filter @commerce-os/storefront-web exec next dev --port 3100
    environment:
      SERVICE_NAME: storefront-web-e2e
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:4000
      STOREFRONT_DEMO_STORE_SLUG: e2e-store
      STOREFRONT_CART_SECRET: e2e-cart-secret
      PORT: 3100
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Shopping Balance Admin E2E — branch checkout'undan build eden store-admin app (CI ONLY).
  # Faz E1: aktif mağaza StoreUser oturumundan gelir (BFF slug OKUMAZ); tenant çözümü gateway
  # overlay'inde STORE_ADMIN_STORE_SLUG=e2e-store ile. http localhost olduğundan cookie
  # Secure=false (Playwright oturumu saklayabilsin). :3110 (base store-admin-web :3002 ile çakışmaz).
  store-admin-web-e2e:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
    command: pnpm --filter @commerce-os/store-admin-web exec next dev --port 3110
    environment:
      SERVICE_NAME: store-admin-web-e2e
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:4000
      ADMIN_COOKIE_SECURE: "false"
      ADMIN_COOKIE_SAME_SITE: lax
      PORT: 3110
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3110:3110"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3110/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # TODO-178 Faz F — Platform Admin (admin-web) GLOBAL konsolu; Store→Platform talep sisteminin
  # platform yüzeyi. store-admin-web-e2e ile SİMETRİK (branch checkout'undan build, next dev, cookie
  # Secure=false → Playwright oturumu saklayabilir). :3120 (base admin-web :3001 ile çakışmaz).
  # NOT: admin-web mağaza-scope DEĞİL (STORE_ADMIN_DEMO_STORE_SLUG yok); global platform login.
  admin-web-e2e:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
    command: pnpm --filter @commerce-os/admin-web exec next dev --port 3120
    environment:
      SERVICE_NAME: admin-web-e2e
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:4000
      ADMIN_COOKIE_SECURE: "false"
      ADMIN_COOKIE_SAME_SITE: lax
      PORT: 3120
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3120:3120"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3120/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # TODO-B (ADR-271) — Base api-gateway servisinin store-auth TENANT config'ini e2e mağazasına
  # hizala (base = enterprise-demo). Overlay `environment` yalnız bu anahtarı override eder; diğer
  # base env korunur. Store-auth login henüz e2e'de koşmuyor; bu, ileride tutarlı tek-mağaza içindir.
  api-gateway:
    environment:
      STORE_ADMIN_STORE_SLUG: e2e-store
